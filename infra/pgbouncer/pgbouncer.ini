[databases]
ngois = host=postgres port=5432 dbname=ngois

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 20
reserve_pool_size = 5
server_idle_timeout = 600
max_client_conn = 200
ignore_startup_parameters = extra_float_digits
admin_users = ngois
stats_users = ngois

# Argo CD root app — apps + canary Rollouts (staging-ready).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ngois-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ngois
spec:
  project: ngois
  source:
    repoURL: https://github.com/example/ngo-intelligence-suite.git
    targetRevision: main
    path: infra/kubernetes
    directory:
      recurse: true
      include: '{apps/**/kustomization.yaml,canary/kustomization.yaml,base/*.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: ngois
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ngois-canary
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ngois
    ngois.io/canary: "true"
spec:
  project: ngois
  source:
    repoURL: https://github.com/example/ngo-intelligence-suite.git
    targetRevision: main
    path: infra/kubernetes/canary
  destination:
    server: https://kubernetes.default.svc
    namespace: ngois
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ngois
  namespace: argocd
spec:
  description: NGO Intelligence Suite
  sourceRepos:
    - '*'
  destinations:
    - namespace: ngois
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: argoproj.io
      kind: '*'

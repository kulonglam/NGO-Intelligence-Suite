# Argo Rollouts progressive delivery for api-gateway (SDD §22 / Phase 1 gate #2 prep).
# Requires Argo Rollouts controller. Apply after AnalysisTemplate.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-gateway
  namespace: ngois
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: ngois
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/v1/health"
    spec:
      serviceAccountName: api-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: europe-west1-docker.pkg.dev/ngois-stub/ngois/api-gateway:digest-replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: ngois-gateway-env
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
  strategy:
    canary:
      canaryService: api-gateway-canary
      stableService: api-gateway
      trafficRouting: {}
      analysis:
        templates:
          - templateName: ngois-error-rate
        args:
          - name: service-name
            value: api-gateway
      steps:
        - setWeight: 5
        - pause: { duration: 1h }
        - analysis:
            templates:
              - templateName: ngois-error-rate
            args:
              - name: service-name
                value: api-gateway
        - setWeight: 25
        - pause: { duration: 6h }
        - setWeight: 50
        - pause: { duration: 24h }
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-canary
  namespace: ngois
  labels:
    app: api-gateway
    ngois.io/canary: "true"
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http

# Canary rollout stub (Phase 1) — does NOT satisfy gate #2 (14-day prod canary).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ngois-canary-config
  namespace: ngois
  labels:
    app.kubernetes.io/part-of: ngois
    ngois.io/canary: "true"
data:
  weight: "5"
  durationHintDays: "14"
  note: "Stub only — apply with Argo Rollouts / Flagger in a real cluster."
---
# Placeholder Rollout object (not applied in local CI)
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-gateway-canary
  namespace: ngois
spec:
  replicas: 2
  strategy:
    canary:
      steps:
        - setWeight: 5
        - pause: { duration: 1h }
        - setWeight: 25
        - pause: { duration: 6h }
        - setWeight: 100
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ngois/api-gateway:canary
          ports:
            - containerPort: 3000

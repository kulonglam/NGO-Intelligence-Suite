# STUB Prometheus scrape config for Phase 1 services.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/phase1-alerts.yaml

scrape_configs:
  - job_name: ngois-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway.ngois.svc:3000
          - auth-service.ngois.svc:3001
          - grant-service.ngois.svc:3002
          - file-service.ngois.svc:3010
          - tenant-service.ngois.svc:3014
        labels:
          platform: ngois
          stub: "true"
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector.ngois.svc:8889"]
